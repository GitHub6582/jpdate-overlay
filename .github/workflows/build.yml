name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute for gradlew (if present)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Build debug APK (Gradle Wrapper)
        if: hashFiles('gradlew') != ''
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build debug APK (system Gradle)
        if: hashFiles('gradlew') == ''
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.6/bin/gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jpdate-overlay-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
